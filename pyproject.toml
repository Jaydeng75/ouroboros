[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "OUROBOROS: $0 recursive self-improvement loop (local harness first)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
